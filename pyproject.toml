[project]
name = "sellside-distillation"
version = "0.1.0"
description = "An offline, evidence-linked equity research experiment lab"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage==7.16.1",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "ruff==0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["research_lab", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["research_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if __name__ == .__main__.:", "class .*\\(Protocol\\):"]
